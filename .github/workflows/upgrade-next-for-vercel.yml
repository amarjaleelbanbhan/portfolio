name: Upgrade Next for Vercel

on:
  push:
    branches:
      - fix/vercel-next-upgrade
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/vercel-next-upgrade

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade Next.js packages
        run: npm install next@16.3.5 eslint-config-next@16.3.5 --save-exact

      - name: Verify production build
        run: npm run build

      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "fix: upgrade Next.js for Vercel deployment"
          git push origin HEAD:fix/vercel-next-upgrade
